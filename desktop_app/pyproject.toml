[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apexis-desktop"
version = "0.1.0"
description = "APEXIS Brain Node desktop and CLI client"
requires-python = ">=3.12,<3.14"
dependencies = [
    "apexis-shared==0.1.0",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
]

[project.scripts]
apexis = "apexis_desktop.status:main"

[tool.setuptools.packages.find]
where = ["src"]
