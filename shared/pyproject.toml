[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apexis-shared"
version = "0.1.0"
description = "Shared contracts for APEXIS nodes"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
