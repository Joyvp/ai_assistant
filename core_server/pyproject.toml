[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apexis-core"
version = "0.1.0"
description = "APEXIS Headquarters Core API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "apexis-shared==0.1.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
